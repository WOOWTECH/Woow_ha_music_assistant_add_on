name: mirror-sync

# Nightly git sync: pulls latest from upstream, adds a snapshot of it to the
# `upstream` branch, then rebuilds `main` (patched) with our overlay files and
# the image: field rewrites applied on top.
#
# `main` only moves forward. Each sync rebuilds the tree from upstream and
# commits it on top of the previous `main`; it is never force-pushed.
# Woow_HA_App_Store pins published add-on snapshots by commit and accepts a
# new snapshot only when it descends from the one it already has, so a
# rewritten `main` would block every later release.
#
# Upstream's `.github` folder (its CI configuration) is not copied anywhere.
# GitHub does not let this workflow's token push workflow files, so an
# upstream change to its workflow files made the exact mirror fail every
# night (jellyfin from 2026-10-22). The `upstream` branch therefore holds
# upstream's source without `.github`, one snapshot commit per change, and
# is never force-pushed. Upstream tags are no longer copied either: they
# point at upstream commits, `.github` included. Same steps as the dnsmasq
# mirror (a30e5da).
#
# Nothing ships unchecked (pipeline #91). After the sync, in this order, each
# job waiting for the one before it:
#   1. image-mirror copies the images of the pushed commit to GHCR (a failed
#      copy stops the run);
#   2. the Store's upgrade comparison (sha mode) compares each add-on whose
#      version differs from its latest formal Release with that Release:
#      categories 1-4, both sides the GHCR image users install;
#   3. the Store's Release workflow creates a Release only for the add-ons
#      that passed (`components`). Any add-on that failed fails this run; the
#      others still get their Release.
# On the schedule, steps 1-3 run only when the sync pushed a new commit.
# workflow_dispatch always runs them, so after adding a declaration a manual
# run checks the same upstream version again. Prerelease channels (beta,
# nightly, dev) never reach the Store and are neither compared nor released.
#
# Overlay files for the upgrade comparison live in .mirror/<add-on dir>/:
# upgrade-check/ (hooks, settings) and upgrade-notes.yaml (declared breaking
# changes, with the migration). The rebuild copies them into <add-on dir>/,
# where the Store tools read them. A breaking upstream change that is
# intended: declare it in .mirror/<add-on dir>/upgrade-notes.yaml, commit,
# then run this workflow by hand; the declaration goes into the Release notes.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: mirror-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      changed: ${{ steps.push.outputs.changed }}
    steps:
      - name: Checkout main (with full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Snapshot overlay files
        run: |
          set -e
          mkdir -p /tmp/overlay
          # Copy overlay (files we add on top of upstream)
          [ -d .github ]  && cp -a .github  /tmp/overlay/
          [ -d .mirror ]  && cp -a .mirror  /tmp/overlay/
          [ -f README.md ] && cp -a README.md /tmp/overlay/
          echo "Overlay snapshot:"; find /tmp/overlay -maxdepth 3 -type f

      - name: Load mirror config
        run: |
          set -a
          . .mirror/config.env
          set +a
          echo "UPSTREAM_URL=$UPSTREAM_URL"       >> $GITHUB_ENV
          echo "UPSTREAM_BRANCH=$UPSTREAM_BRANCH" >> $GITHUB_ENV
          echo "MIRROR_IMAGE_PREFIX=$MIRROR_IMAGE_PREFIX" >> $GITHUB_ENV

      - name: Fetch upstream source and tags
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream --tags --prune --force

      - name: Update upstream source snapshot branch
        run: |
          set -euo pipefail
          # Upstream's tree without `.github`, built in a scratch index.
          export GIT_INDEX_FILE="$RUNNER_TEMP/upstream-snapshot.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "upstream/$UPSTREAM_BRANCH"
          git rm -r -q --cached --ignore-unmatch .github
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          parent=$(git rev-parse --verify -q refs/remotes/origin/upstream || true)
          if [ -n "$parent" ] && [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
            echo "Upstream snapshot unchanged."
            exit 0
          fi
          upstream_commit=$(git rev-parse "upstream/$UPSTREAM_BRANCH")
          export GIT_AUTHOR_NAME="WOOWTECH Mirror Bot" GIT_COMMITTER_NAME="WOOWTECH Mirror Bot"
          export GIT_AUTHOR_EMAIL="woowtech-mirror-bot@designsmart.com.tw" GIT_COMMITTER_EMAIL="woowtech-mirror-bot@designsmart.com.tw"
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} \
            -m "[bot] upstream snapshot ${UPSTREAM_URL##*/}@${upstream_commit} without .github")
          # A normal push: the snapshot sits on top of the previous one.
          git push origin "$commit:refs/heads/upstream"

      - name: Rebuild main = upstream + overlay + image patches
        run: |
          set -e
          # Keep `main` checked out and replace its index and work tree with
          # upstream's tree, so the commit below sits on top of the old main.
          git checkout main
          git read-tree --reset -u "upstream/$UPSTREAM_BRANCH"
          # Upstream's CI configuration is not part of the add-on.
          rm -rf .github
          # Re-apply overlay
          cp -a /tmp/overlay/. .
          # Upgrade comparison hooks and declarations (pipeline #91):
          # .mirror/<add-on dir>/{upgrade-check/,upgrade-notes.yaml} -> <add-on dir>/
          for src in .mirror/*/; do
            [ -d "$src" ] || continue
            addon=$(basename "$src")
            if [ ! -d "$addon" ]; then
              echo "::warning::.mirror/$addon/ has no add-on directory $addon/ upstream; not copied"
              continue
            fi
            if [ -d "$src/upgrade-check" ]; then
              rm -rf "$addon/upgrade-check"
              cp -a "$src/upgrade-check" "$addon/upgrade-check"
              echo "Copied .mirror/$addon/upgrade-check/ into $addon/"
            fi
            if [ -f "$src/upgrade-notes.yaml" ]; then
              cp -a "$src/upgrade-notes.yaml" "$addon/upgrade-notes.yaml"
              echo "Copied .mirror/$addon/upgrade-notes.yaml into $addon/"
            fi
          done
          # Patch image: fields
          python3 .mirror/patch-image.py
          # Refresh last-sync stamp
          {
            echo "last_sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "upstream_url: $UPSTREAM_URL"
            echo "upstream_branch: $UPSTREAM_BRANCH"
            echo "upstream_commit: $(git rev-parse upstream/$UPSTREAM_BRANCH)"
            echo "mirror_image_prefix: $MIRROR_IMAGE_PREFIX"
          } > .mirror/last-sync.yaml

      - name: Commit & push main
        id: push
        run: |
          git config user.email "woowtech-mirror-bot@designsmart.com.tw"
          git config user.name  "WOOWTECH Mirror Bot"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes; skipping commit."
            changed=false
          else
            git commit -m "[bot] mirror sync $(date -u +%Y-%m-%d) — ${UPSTREAM_URL##*/}@${UPSTREAM_BRANCH}"
            changed=true
          fi
          git push origin main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # 1. Copy the pushed commit's images to GHCR before anything compares them.
  # Scheduled runs go on only when the sync pushed a commit; a manual run always does.
  image-mirror:
    name: Image copy
    needs: sync
    if: needs.sync.outputs.sha != '' && (needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-mirror.yml
    with:
      sha: ${{ needs.sync.outputs.sha }}

  # 2. Upgrade comparison (sha mode, Store #167): each add-on whose version is not
  # its latest formal Release's is compared with that Release. Runs only after a
  # successful image copy. Its output `passed` is the JSON array of the add-ons
  # that passed; any failed add-on fails this job and so the run.
  upgrade-comparison:
    name: Upgrade comparison
    needs: [sync, image-mirror]
    permissions:
      contents: read
      actions: read
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-upgrade-check.yml@main
    with:
      sha: ${{ needs.sync.outputs.sha }}

  # 3. The App Store ships only formal Releases (registry ref_policy: release).
  # Release the pushed commit for the add-ons that passed only (Store #168): each
  # gets its <slug>-v<version> Release, with its upgrade-notes.yaml declarations
  # in the notes. It runs also when the comparison failed (some add-ons may have
  # passed), but never without a list: an empty `components` would release every
  # add-on, so "" (the comparison did not run or gave no output) skips it, and so
  # does [] (none passed).
  release:
    name: Release
    needs: [sync, image-mirror, upgrade-comparison]
    if: >-
      ${{ !cancelled()
      && needs.sync.result == 'success'
      && needs.image-mirror.result == 'success'
      && (needs.upgrade-comparison.result == 'success' || needs.upgrade-comparison.result == 'failure')
      && needs.upgrade-comparison.outputs.passed != ''
      && needs.upgrade-comparison.outputs.passed != '[]' }}
    permissions:
      contents: write
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-release.yml@main
    with:
      sha: ${{ needs.sync.outputs.sha }}
      components: ${{ needs.upgrade-comparison.outputs.passed }}
